[project]
name = "cachebench"
version = "0.1.0"
description = "LLM gateway with exact-match and semantic caching, plus threshold tuning tooling"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
    "redis==8.2.0",
    "faiss-cpu==1.15.1",
    "sentence-transformers==6.3.0",
    "torch==2.15.0",
    "transformers==5.24.0",
    "numpy==2.5.5",
    "huggingface-hub==2.4.0",
    "structlog==26.1.0",
    "orjson==3.13.0",
    "onnxruntime==1.32.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "fakeredis==2.41.0",
    "respx==0.23.1",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cachebench"]

# CPU-only torch on Linux (Docker). macOS wheels from PyPI are already CPU/MPS-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs running services (Redis, Docker Compose)",
    "slow: loads the embedding model or other heavy resources",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
